services:
  ai-image-detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-image-detector-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=*
      - SIGHTENGINE_API_USER=382710496
      - SIGHTENGINE_API_SECRET=ADQRT3n7ZdXNWYC2p2fFUhbxMRibWSDb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
